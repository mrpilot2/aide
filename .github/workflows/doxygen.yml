name: Publish Doxygen GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v5
        with:
          path: ../Qt
          key: ${{ runner.os }}-QtCache

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          cached: ${{ steps.cache-qt.outputs.cache-hit }}
          version: '6.5.0'
          aqtversion: '==3.1.*'

      - name: Install Doxygen
        run: sudo apt install doxygen graphviz -y

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Build doxygen documentation
        run: cmake --workflow --preset workflow-ci-doxygen-unix

      - name: Publish doxygen documentation to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: build/ci-doxygen-unix/aide/doc/html
          github_token: ${{ secrets.GITHUB_TOKEN }}
