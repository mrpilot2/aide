name: Publish Documentation to GitHub Pages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  docs:
    name: Build and deploy docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Doxygen
        run: sudo apt-get install -y doxygen

      - name: Generate Doxygen XML
        run: |
          mkdir -p build/doxygen
          doxygen docs/devdocs/Doxyfile

      - name: Install doxybook2
        run: |
          curl -L https://github.com/matusnovak/doxybook2/releases/download/v1.5.0/doxybook2-linux-amd64-v1.5.0.zip -o doxybook2.zip
          unzip doxybook2.zip -d doxybook2
          sudo install doxybook2/bin/doxybook2 /usr/local/bin/doxybook2

      - name: Generate API reference Markdown
        run: |
          doxybook2 \
            --input build/doxygen/xml \
            --output docs/devdocs/api-reference \
            --config .doxybook/config.json
          rm -f docs/devdocs/api-reference/index_files.md \
                docs/devdocs/api-reference/index_groups.md \
                docs/devdocs/api-reference/index_examples.md \
                docs/devdocs/api-reference/index_pages.md
          sed -i '/^!!! info "CI-generated content"/,/^---$/d' docs/devdocs/api-reference/index.md

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs and plugins
        run: pip install mkdocs-material mike==2.1.3

      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1 || true

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Deploy release docs
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          minor="${version%.*}"
          mike deploy --push --update-aliases "${minor}" latest
          mike set-default --push latest

      - name: Deploy development docs
        if: github.ref == 'refs/heads/main'
        run: mike deploy --push dev
