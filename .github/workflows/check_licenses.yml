name: Check third party licenses

on:
  workflow_call:

jobs:
  check_license:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: setup_deps
        uses: ./.github/actions/setup_deps

      - name: Check third party licenses
        run: cmake --workflow --preset workflow-ci-license-check-unix
