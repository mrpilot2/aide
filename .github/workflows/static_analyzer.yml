name: CI - Static Analyzer

on:
  workflow_call:

jobs:
  clang-tidy:
    name: clang-tidy, ${{ matrix.cmake_name }}, ${{ matrix.qt_name }}
    strategy:
      fail-fast: false
      matrix:
        cmake: [4.x]
        qt: [6.9.2]

        include:
          - cmake: 4.x
            cmake_name: CMake Latest

          - qt: 6.9.2
            qt_name: Qt6

    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: setup_deps
        uses: ./.github/actions/setup_deps
        with:
          cmake_version: ${{matrix.cmake}}
          qt_version: ${{ matrix.qt }}

      # Static Debug: clang-tidy
      - name: "Static Debug: clang-tidy"
        run: cmake --workflow --preset=workflow-ci-static-clang-tidy-unix-static-debug
        env:
          QT_QPA_PLATFORM: offscreen

      - name: "Summarize clang-tidy check profile"
        if: always()
        run: python3 tools/summarize_clang_tidy_profile.py build/ci-static-clang-tidy-unix-static-debug/clang-tidy-profile

      - name: Upload clang-tidy profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clang-tidy-profile
          path: build/ci-static-clang-tidy-unix-static-debug/clang-tidy-profile

  cppcheck:
    name: cppcheck, ${{ matrix.cmake_name }}, ${{ matrix.qt_name }}
    strategy:
      fail-fast: false
      matrix:
        cmake: [4.x]
        qt: [6.9.2]

        include:
          - cmake: 4.x
            cmake_name: CMake Latest

          - qt: 6.9.2
            qt_name: Qt6

    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: setup_deps
        uses: ./.github/actions/setup_deps
        with:
          cmake_version: ${{matrix.cmake}}
          qt_version: ${{ matrix.qt }}

      - name: Install apt dependencies
        run: sudo apt install cppcheck

      # Static Debug: cppcheck
      - name: "Static Debug: cppcheck"
        run: cmake --workflow --preset=workflow-ci-static-cppcheck-unix-static-debug
        env:
          QT_QPA_PLATFORM: offscreen
