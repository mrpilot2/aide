name: CI - Generate coverage report

on:
  workflow_call:

jobs:
  build:
    name: ${{ matrix.os }}, ${{ matrix.cmake_name }}, ${{ matrix.qt_name }}
    permissions:
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        cmake: [4.x]
        qt: ["6.5.0"]

        include:
          - cmake: 4.x
            cmake_name: CMake Latest

          - qt: "6.5.0"
            qt_name: Qt6

          - qt: "6.5.0"
            cmake: 4.x
            os: ubuntu-24.04
            GCOV_TOOL: gcov

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x
          cache: 'pip'

      - name: Install pip dependencies
        run: |
          pip3 install wheel setuptools
          pip3 install conan

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{matrix.cmake}}

      - name: Print CMake version
        run: cmake --version

      - name: Install and cache apt dependencies
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: lcov ^libxcb-*
          version: 1.0

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          cache: true
          version: ${{ matrix.qt }}
          aqtversion: '==3.1.*'

      # Static Debug
      - name: "Coverage Workflow (static debug)"
        run: cmake --workflow --preset workflow-ci-coverage-unix
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Generate and coverage reports
        working-directory: build/ci-coverage-unix
        run: |
          lcov --gcov-tool gcov --directory . --capture --output-file coverage.info # capture coverage info
          lcov --gcov-tool gcov --remove coverage.info '/usr/*' --output-file coverage.info # filter out system
          lcov --gcov-tool gcov --list coverage.info #debug info

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          use_oidc: true
